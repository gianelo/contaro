<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    a { color: #0E7C66; } a:hover { color: #0A5E4D; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 664px; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1C1C1E; display: flex; flex-direction: column; box-sizing: border-box;">

  <!--
    The head #105 gives this screen instead of the account row and the Space
    heading (ADR-0047 amended): Cancelar, the title, and an invisible copy of
    Cancelar that only centres the title. No pill underneath -- this form asks
    for no attribution, the same refusal ADR-0046 already gave the plan's
    entry screen.
  -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; min-height: 44px;">
    <span style="font-size: 17px; color: #0E7C66;">Cancelar</span>
    <span style="font-size: 17px; font-weight: 600;">Corregir el gasto fijo</span>
    <span style="font-size: 17px; color: transparent;">Cancelar</span>
  </div>
  <div style="height: 10px;"></div>

  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 16px;">
    <div style="height: 60px; display: flex; align-items: baseline; justify-content: center; gap: 4px;">
      <span style="font-size: 30px; font-weight: 300; line-height: 1.1;">$</span>
      <span style="font-size: 52px; font-weight: 600; letter-spacing: -1.5px; line-height: 1.1;">1.800.000</span>
    </div>
    <span style="text-align: center; font-size: 12px; line-height: 1.25; color: #8E8E93;">COP</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0 16px;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">1</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">2</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">3</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">4</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">5</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">6</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">7</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">8</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">9</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">000</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px; font-size: 25px;">0</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 10px;">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round"><path d="M21 5H9.5L3.5 12l6 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
    </div>
  </div>

  <div style="height: 4px;"></div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px;">
    <span style="font-size: 13px; line-height: 1.25; font-weight: 600; letter-spacing: 0.4px; color: #8E8E93;">CÓMO SE LLAMA</span>
    <div style="display: flex; align-items: center; min-height: 44px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D8D8DC; border-radius: 13px; padding: 0 14px;">
      <span style="font-size: 17px;">Arriendo</span>
    </div>
  </div>

  <div style="height: 4px;"></div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px;">
    <span style="font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.4px; color: #8E8E93;">QUÉ DÍA DEL MES VENCE</span>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D8D8DC; border-radius: 13px; padding: 0 14px;">
      <span style="font-size: 17px;">1</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <div style="height: 4px;"></div>

  <div style="padding: 0 16px;">
    <div style="font-size: 12px; line-height: 1.25; font-weight: 600; letter-spacing: 0.4px; color: #8E8E93; padding-bottom: 8px;">CATEGORÍA</div>
    <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
      <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; border-radius: 999px; padding: 6px 16px; background: #0E7C66; box-shadow: inset 0 0 0 1px #0E7C66; flex-shrink: 0;">
        <span style="font-size: 14px; font-weight: 500; color: #FFFFFF;">Vivienda</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; border-radius: 999px; padding: 6px 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D8D8DC; flex-shrink: 0;">
        <span style="font-size: 14px; font-weight: 500;">Comida</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; border-radius: 999px; padding: 6px 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D8D8DC; flex-shrink: 0;">
        <span style="font-size: 14px; font-weight: 500;">Suscripciones</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; border-radius: 999px; padding: 6px 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D8D8DC; flex-shrink: 0;">
        <span style="font-size: 14px; font-weight: 500;">Salud</span>
      </div>
    </div>
  </div>

  <div style="height: 4px;"></div>

  <div style="padding: 0 16px;">
    <div style="height: 44px; border-radius: 13px; background: #0E7C66; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Guardar</span>
    </div>
  </div>

  <!--
    4px, not the 16px this used to hold Sacar del plan off Guardar. This is
    the screen #105 was about: one field more than the Variable form above
    (the due day), which is what spends every pixel the shell removal bought
    and leaves this margin with nothing to give back (ADR-0047 amended --
    Guardar ends at 600, and the 64px under it is exactly 4 + 44 + 16).
  -->
  <div style="height: 4px;"></div>

  <div style="padding: 0 16px;">
    <div style="height: 44px; border-radius: 13px; background: #D6342C; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Sacar del plan</span>
    </div>
  </div>

  <div style="height: 16px;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":664}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
