    /*
     * #138 -- canvas staging, not a product colour. This bottom sheet is
     * drawn over the page, and behind a real sheet the page is dimmed by
     * `--color-scrim`, a translucent black the browser composites live. A
     * static artboard has no paint step to composite in: it can only draw one
     * flat pixel per surface, so the dimmed page is approximated here as a
     * single opaque colour instead of the page-plus-scrim the running app
     * actually layers. Naming that approximation its own `--canvas-*`
     * property, rather than leaving it an unexplained hex or banning every hex
     * outright, is what keeps it countable and self-documenting -- a blunter
     * rule could not tell this staging apart from the drift #138 exists to
     * catch.
     */
    :root { --canvas-scrim-over-page: #6E6E73; }

    /*
     * The other half of that same approximation, and staging for the same
     * reason: the name of the screen the sheet is covering, showing through.
     * The running app draws that heading in `--color-text` -- dark ink -- and
     * then lays `--color-scrim` over the whole page, so the scrim makes it
     * *darker*. Drawn here it has to read against the one flat grey above, so
     * it is drawn light instead. No product token describes that, because the
     * product never draws a 30px white heading on grey; naming a ground token
     * for it just because the hex matched would be the rule satisfied and the
     * meaning lost (#138).
     */
    :root { --canvas-page-ink-behind-scrim: #FFFFFF; }

    body { margin: 0; -webkit-font-smoothing: antialiased; }
    a { color: var(--color-accent); } a:hover { color: var(--color-accent-pressed); }
