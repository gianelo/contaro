<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    a { color: #2FA98C; } a:hover { color: #46C0A3; }
    .k:active { background: #3A3A3C !important; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 16px;">
    <span style="font-size: 17px; color: #2FA98C;">Cancelar</span>
    <span style="font-size: 17px; font-weight: 600;">Nuevo movimiento</span>
    <span style="font-size: 17px; color: transparent;">Cancelar</span>
  </div>

  <div style="display: flex; justify-content: center; padding-bottom: 10px;">
    <div style="display: flex; align-items: center; gap: 6px; background: #1C1C1E; border-radius: 999px; padding: 5px 12px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#98989E" stroke-width="2" stroke-linecap="round"><path d="M17 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.9"/></svg>
      <span style="font-size: 13px; color: #98989E;">Compartido con Ana</span>
    </div>
  </div>

  <div style="display: flex; padding: 0 16px 14px 16px;">
    <div style="display: flex; flex: 1; background: #1C1C1E; border-radius: 9px; padding: 2px; gap: 2px;">
      <sc-for list="{{tipos}}" as="t" hint-placeholder-count="2">
        <div onClick="{{t.pick}}" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 40px; font-size: 14px; font-weight: 600; border-radius: 7px; background: {{t.bg}}; color: {{t.fg}};">{{t.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 6px 16px 2px 16px;">
    <span style="font-size: 30px; font-weight: 300; color: {{montoColor}};">$</span>
    <span style="font-size: 52px; font-weight: 600; letter-spacing: -1.5px; color: {{montoColor}};">{{montoTexto}}</span>
  </div>
  <div style="text-align: center; font-size: 12px; color: #6C6C70; padding-bottom: 14px;">COP</div>

  <div style="padding: 0 16px 12px 16px;">
    <div style="display: flex; align-items: center; gap: 8px; background: #1C1C1E; border-radius: 11px; padding: 10px 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#98989E" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span style="font-size: 14px;">Hoy</span>
      <span style="color: #48484A;">·</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#98989E" stroke-width="2" stroke-linecap="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size: 14px;">Gian</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 13px; font-weight: 500; color: #2FA98C; padding: 12px 2px; margin: -12px 0;">Cambiar</span>
    </div>
  </div>

  <div style="padding: 0 0 4px 16px; font-size: 12px; font-weight: 600; color: #6C6C70; letter-spacing: 0.4px;">CATEGORÍA</div>
  <div style="display: flex; flex-wrap: wrap; gap: 7px; padding: 0 16px 14px 16px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <div onClick="{{c.pick}}" style="display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; border-radius: 999px; padding: 0 15px; background: {{c.bg}}; border: 1px solid {{c.border}};">
        <span style="font-size: 14px; font-weight: 500; color: {{c.fg}};">{{c.label}}</span>
      </div>
    </sc-for>
  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 10px 12px;">
    <sc-for list="{{teclas}}" as="k" hint-placeholder-count="12">
      <div class="k" onClick="{{k.press}}" style="height: 50px; display: flex; align-items: center; justify-content: center; background: #1C1C1E; border-radius: 10px; font-size: 25px; font-weight: 400; color: #FFFFFF;"><sc-if value="{{k.esNumero}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if><sc-if value="{{k.esBorrar}}" hint-placeholder-val="{{false}}"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M21 5H9.5L3.5 12l6 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></sc-if></div>
    </sc-for>
  </div>

  <div style="padding: 4px 16px 22px 16px;">
    <div style="height: 52px; border-radius: 13px; background: {{guardarBg}}; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: {{guardarFg}};">Guardar</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { monto: '', cat: 'super', tipo: 'gasto' };
  }
  renderVals() {
    const s = this.state;
    const miles = (v) => v.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const tipos = [
      { id: 'gasto', label: 'Gasto' },
      { id: 'ingreso', label: 'Ingreso' }
    ].map((t) => ({
      ...t,
      bg: s.tipo === t.id ? '#3A3A3C' : 'transparent',
      fg: s.tipo === t.id ? '#FFFFFF' : '#98989E',
      pick: () => this.setState({ tipo: t.id })
    }));
    const cats = [
      { id: 'super', label: 'Súper' },
      { id: 'rest', label: 'Restaurante' },
      { id: 'pan', label: 'Panadería' },
      { id: 'transporte', label: 'Transporte' },
      { id: 'ocio', label: 'Ocio' },
      { id: 'personal', label: 'Personal' }
    ].map((c) => ({
      ...c,
      bg: s.cat === c.id ? '#2FA98C' : '#1C1C1E',
      fg: s.cat === c.id ? '#00201A' : '#FFFFFF',
      border: s.cat === c.id ? '#2FA98C' : '#3A3A3C',
      pick: () => this.setState({ cat: c.id })
    }));
    const teclas = ['1','2','3','4','5','6','7','8','9','000','0','del'].map((k) => ({
      label: k,
      esBorrar: k === 'del',
      esNumero: k !== 'del',
      press: () => {
        if (k === 'del') return this.setState({ monto: s.monto.slice(0, -1) });
        if (s.monto.length > 10) return;
        if (s.monto === '' && (k === '0' || k === '000')) return;
        this.setState({ monto: s.monto + k });
      }
    }));
    return {
      tipos, cats, teclas,
      montoTexto: s.monto === '' ? '0' : miles(s.monto),
      montoColor: s.monto === '' ? '#48484A' : '#FFFFFF',
      guardarBg: s.monto === '' ? '#2C2C2E' : '#2FA98C',
      guardarFg: s.monto === '' ? '#6C6C70' : '#00201A'
    };
  }
}
</script>
</body>
</html>
